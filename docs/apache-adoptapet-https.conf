# AdoptAPet local HTTPS virtual-host template (Apache 2.4 / XAMPP).
# Template only: append to httpd-vhosts.conf; never replace that file.
# If adoptapet.test already has a *:443 vhost, update it instead of adding a duplicate.
# Required: mod_ssl and mod_log_config; the app's .htaccess uses mod_rewrite.
# The standard httpd-ssl.conf include may require mod_socache_shmcb.
#
# EDIT this example to the full project folder on this PC. It must contain public/.
Define ADOPTAPET_PROJECT_ROOT "C:/xampp/htdocs/AdoptAPet"

<VirtualHost *:443>
    ServerName adoptapet.test
    DocumentRoot "${ADOPTAPET_PROJECT_ROOT}/public"

    SSLEngine on
    SSLCertificateFile "${SRVROOT}/conf/adoptapet-tls/adoptapet.test.pem"
    SSLCertificateKeyFile "${SRVROOT}/conf/adoptapet-tls/adoptapet.test-key.pem"

    <Directory "${ADOPTAPET_PROJECT_ROOT}/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "${SRVROOT}/logs/adoptapet-https-error.log"
    CustomLog "${SRVROOT}/logs/adoptapet-https-access.log" combined
</VirtualHost>
